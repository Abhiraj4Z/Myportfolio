<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">Smart expense tracker</title>
  <desc id="desc">A personal finance dashboard showing a monthly balance, spending categories, and a weekly chart.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10163a"/><stop offset="1" stop-color="#25164a"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00f5ff"/><stop offset="1" stop-color="#b44fff"/></linearGradient></defs>
  <rect width="900" height="480" fill="url(#bg)"/><rect x="110" y="45" width="680" height="390" rx="24" fill="#090b22" stroke="#ffffff" stroke-opacity=".16"/>
  <rect x="144" y="78" width="30" height="30" rx="10" fill="url(#accent)"/><path d="M159 84v18m-6-12h10c6 0 6 9 0 9h-9" fill="none" stroke="#071126" stroke-width="2.5" stroke-linecap="round"/><rect x="188" y="81" width="174" height="9" rx="5" fill="#e8e8f5"/><rect x="188" y="98" width="100" height="6" rx="3" fill="#8888aa"/>
