  <rect x="464" y="132" width="292" height="116" rx="16" fill="#121938"/><text x="488" y="163" fill="#a9accb" font-family="Arial,sans-serif" font-size="13">SPENDING BREAKDOWN</text><circle cx="530" cy="202" r="27" fill="none" stroke="#242c52" stroke-width="10"/><path d="M530 175a27 27 0 0 1 25 37" fill="none" stroke="#00f5ff" stroke-width="10" stroke-linecap="round"/><path d="M555 212a27 27 0 0 1-43 12" fill="none" stroke="#b44fff" stroke-width="10" stroke-linecap="round"/><g font-family="Arial,sans-serif" font-size="11" fill="#b7bbd8"><circle cx="588" cy="193" r="4" fill="#00f5ff"/><text x="601" y="197">Essentials</text><circle cx="588" cy="213" r="4" fill="#b44fff"/><text x="601" y="217">Lifestyle</text></g>
